version: '3.8'

services:
  # TimescaleDB Database
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: iot-dashboard-db
    environment:
      POSTGRES_DB: iot_dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "15432:5432"  # Using 15432 to avoid conflict with local PostgreSQL
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      # Auto-run init scripts
      - ./db/migrations:/docker-entrypoint-initdb.d
    networks:
      - iot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot-dashboard-app
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@timescaledb:5432/iot_dashboard
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-super-secret-key-change-in-production}
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Internal Docker network URL for server-side auth
      AUTH_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - iot-network
    # Production mode: uses CMD from Dockerfile (node server.js)

  # Redis (for caching and real-time)
  redis:
    image: redis:7-alpine
    container_name: iot-dashboard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - iot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # FastAPI Backend Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iot-dashboard-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${DB_PASSWORD:-postgres}@timescaledb:5432/iot_dashboard
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - iot-network
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # pgAdmin (Optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: iot-dashboard-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - timescaledb
    networks:
      - iot-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

networks:
  iot-network:
    driver: bridge

volumes:
  timescaledb_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
