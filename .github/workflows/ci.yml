name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build + type-check)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # `next build` type-checks the app and fails on type/build errors.
      # (A standalone `tsc --noEmit` is intentionally not used as the gate
      #  because of pre-existing errors in *.test.ts files.)
      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci-dummy-secret-not-for-production
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:8000
          DATABASE_URL: postgresql://user:password@localhost:5432/iot_dashboard?sslmode=disable

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests
        run: pytest -q
        working-directory: backend
