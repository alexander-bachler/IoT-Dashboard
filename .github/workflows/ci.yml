name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build + type-check)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # `next build` type-checks the app and fails on type/build errors.
      # (A standalone `tsc --noEmit` is intentionally not used as the gate
      #  because of pre-existing errors in *.test.ts files.)
      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci-dummy-secret-not-for-production
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:8000
          DATABASE_URL: postgresql://user:password@localhost:5432/iot_dashboard?sslmode=disable

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests
        run: pytest -q
        working-directory: backend

  integration:
    name: Integration (live stack smoke test)
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: iot_user
          POSTGRES_PASSWORD: iot_password
          POSTGRES_DB: iot_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iot_user -d iot_analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://iot_user:iot_password@localhost:5432/iot_analytics
      SECRET_KEY: ci-dummy-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Apply database schema (TimescaleDB + tables)
        env:
          PGPASSWORD: iot_password
        run: |
          for f in db/migrations/0000_setup_timescaledb.sql db/migrations/0002_advanced_features.sql; do
            echo "Applying $f"
            psql -h localhost -p 5432 -U iot_user -d iot_analytics -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Start API
        working-directory: backend
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/api.log 2>&1 &
          echo "uvicorn started"
      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "API healthy"; exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"; exit 1
      - name: Register smoke-test user
        run: |
          curl -sf -X POST http://localhost:8000/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","username":"smoke","password":"smoke-password-123"}' \
            || echo "register returned non-2xx (user may already exist) — continuing"
      - name: Run smoke test
        run: |
          python backend/scripts/smoke_test.py \
            --base-url http://localhost:8000 \
            --username smoke --password smoke-password-123
      - name: API logs (on failure)
        if: failure()
        run: cat /tmp/api.log || true
