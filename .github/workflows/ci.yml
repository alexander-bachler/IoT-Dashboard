name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build + type-check)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # `next build` type-checks the app and fails on type/build errors.
      # (A standalone `tsc --noEmit` is intentionally not used as the gate
      #  because of pre-existing errors in *.test.ts files.)
      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci-dummy-secret-not-for-production
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:8000
          DATABASE_URL: postgresql://user:password@localhost:5432/iot_dashboard?sslmode=disable

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests
        run: pytest -q
        working-directory: backend

  integration:
    name: Integration (live stack smoke test)
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: iot_user
          POSTGRES_PASSWORD: iot_password
          POSTGRES_DB: iot_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iot_user -d iot_analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://iot_user:iot_password@localhost:5432/iot_analytics
      SECRET_KEY: ci-dummy-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Apply database schema (TimescaleDB + tables)
        env:
          PGPASSWORD: iot_password
        run: |
          for f in db/migrations/0000_setup_timescaledb.sql db/migrations/0002_advanced_features.sql; do
            echo "Applying $f"
            psql -h localhost -p 5432 -U iot_user -d iot_analytics -v ON_ERROR_STOP=1 -f "$f"
          done
      # Start the API and use it in a SINGLE step: a process backgrounded in one
      # step does not reliably survive into the next step on GitHub Actions.
      - name: Start API and run smoke test
        working-directory: backend
        run: |
          set -euo pipefail
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/api.log 2>&1 &
          API_PID=$!
          # Always surface the uvicorn log when this step ends.
          trap 'echo "=== uvicorn log ==="; cat /tmp/api.log || true' EXIT

          echo "Waiting for API health..."
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "API healthy"; break
            fi
            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "uvicorn exited during startup"; exit 1
            fi
            sleep 2
          done
          curl -sf http://localhost:8000/health > /dev/null || { echo "API never became healthy"; exit 1; }

          echo "Registering smoke-test user..."
          curl -s -o /dev/null -w 'register HTTP %{http_code}\n' \
            -X POST http://localhost:8000/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","username":"smoke","password":"smoke-password-123"}' || true

          echo "Running smoke test..."
          python scripts/smoke_test.py \
            --base-url http://localhost:8000 \
            --username smoke --password smoke-password-123
